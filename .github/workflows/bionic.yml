name: bionic (Android 17 libc + linker, arm64)

# Feasibility check for running Android 17 natively the Termux way: build
# Android 17's own C library and dynamic linker from AOSP source, unchanged,
# from a minimal checkout (only the projects they need), within a GitHub runner.

on:
  push:
    paths:
      - ".github/workflows/bionic.yml"
      - "native/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      AOSP_REV: android-17.0.0_r1
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: repo
        run: |
          mkdir -p ~/bin
          curl -sSfL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global color.ui false

      - name: Restore AOSP checkout
        id: aosp
        uses: actions/cache/restore@v4
        with:
          path: ~/aosp
          key: aosp17-${{ hashFiles('native/bionic-projects.txt') }}-v1

      - name: Minimal AOSP checkout
        if: steps.aosp.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/aosp && cd ~/aosp
          repo init -q -u https://android.googlesource.com/platform/manifest -b "$AOSP_REV" \
            --depth=1 --no-clone-bundle
          repo sync -q -c -j8 --no-tags --no-clone-bundle --fail-fast $(cat "$GITHUB_WORKSPACE/native/bionic-projects.txt")
          du -sh ~/aosp
          # keep it under GitHub's 10 GB cache: only the clang and Rust versions the
          # build uses, and no git metadata
          cd ~/aosp/prebuilts/clang/host/linux-x86
          for d in clang-*; do case "$d" in clang-r584948b|clang-stable) ;; *) rm -rf "$d" ;; esac; done
          cd ~/aosp/prebuilts/rust-toolchain/linux-x86
          for d in [0-9]*; do [ "$d" = 1.93.1 ] || rm -rf "$d"; done
          cd ~/aosp && rm -rf .repo
          find . -maxdepth 6 -name .git \( -type l -o -type d \) -prune -exec rm -rf {} +
          du -sh ~/aosp; df -h /

      - name: Save AOSP checkout
        if: steps.aosp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/aosp
          key: aosp17-${{ hashFiles('native/bionic-projects.txt') }}-v1

      - name: Build libc and linker
        run: |
          cd ~/aosp
          # step 2: path prefixing (ANDROID_NATIVE_ROOT) in bionic
          python3 "$GITHUB_WORKSPACE/native/bionic-paths/apply.py" bionic
          # board_config.mk only checks that these VNDK snapshots exist; libc doesn't use them
          for v in 31 32 33 34; do mkdir -p prebuilts/vndk/v$v/arm64; : > prebuilts/vndk/v$v/arm64/Android.bp; done
          # the runtime APEX packaging isn't needed for libc, and its apex_available checks fail here
          rm -f bionic/apex/Android.bp
          # stand-ins for libc's two no_std Rust helpers (not in the public tree)
          rm -rf bionic-rust-shims && cp -r "$GITHUB_WORKSPACE/native/rust-shims" bionic-rust-shims
          # nprops: the property service for native mode
          rm -rf native-nprops && cp -r "$GITHUB_WORKSPACE/native/nprops" native-nprops
          # nbinder: the userspace binder driver for native mode
          rm -rf native-nbinder && cp -r "$GITHUB_WORKSPACE/native/nbinder" native-nbinder
          # nlogd: logd's socket (messages go to a text file)
          rm -rf native-nlogd && cp -r "$GITHUB_WORKSPACE/native/nlogd" native-nlogd
          # host sqlite links ICU's C libraries; ICU's Java libraries need SDK API files we don't have
          rm -f external/icu/android_icu4j/Android.bp external/icu/icu4j/Android.bp
          # debuggerd only lists ART's libdexfile as a runtime (install-time) dependency
          sed -i 's#"libdexfile", // libdexfile_support dependency##' system/core/debuggerd/Android.bp
          source build/envsetup.sh
          lunch module_arm64-trunk_staging-userdebug
          export ALLOW_MISSING_DEPENDENCIES=true
          # no Java boot image (needs ART's dex2oat, not part of this checkout)
          export WITH_DEXPREOPT=false
          # -k: keep going, so one run reports every missing piece
          m -k libc linker libdl libm nprops nbinder nlogd 2>&1 | tee ~/build.log | tail -100
          test ${PIPESTATUS[0]} -eq 0

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          I=~/aosp/out/soong/.intermediates
          find $I/bionic $I/native-nprops $I/native-nbinder $I/native-nlogd -type f \( -name libc.so -o -name libdl.so -o -name libm.so -o -name linker64 -o -name nprops -o -name nbinder -o -name nlogd \) \
            \( -path '*/android_arm64_armv8-a_shared/*' -o -path '*/android_arm64_armv8-a/*' \) \
            -not -path '*/unstripped/*' -not -path '*/before_final_validations/*' | sort | tee out/found.txt
          # the final output of each file is the shortest path (others are intermediates)
          for n in libc.so libdl.so libm.so linker64 nprops nbinder nlogd; do
            f=$(grep "/$n\$" out/found.txt | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
            [ -n "$f" ] && cp "$f" out/ && echo "$n <- $f"
          done
          ls -la out; file out/* || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bionic-android17-arm64
          if-no-files-found: ignore
          path: out/

      - name: Logs on failure
        if: failure()
        run: |
          cp ~/build.log . 2>/dev/null || true
          grep -n -A6 -E '^error|internal error: panic|^FAILED: |missing dependencies' ~/build.log | grep -v '%.*\] ' | head -80 || true
          cp ~/aosp/out/error.log . 2>/dev/null || true
          cp ~/aosp/out/soong.log . 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            build.log
            error.log
            soong.log

  nbinder-test:
    # nbinder and libc's binder stand-in, built for the runner and run against
    # each other: context manager, fds, handles, refcounts, oneway, death.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          cd native/nbinder
          g++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined nbinder.cpp -o /tmp/nbinder
          g++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -DNB_HOST -I. \
            test/nbtest.cpp ../bionic-paths/native_binder.cpp -o /tmp/nbtest -lpthread
          timeout 120 /tmp/nbtest /tmp/nbinder

  mini-root:
    # A small Android 17 root (toybox, sh, their libraries, our libc and linker)
    # to test native mode in Termux on the phone.
    needs: build
    runs-on: ubuntu-24.04
    env:
      IMG_URL: https://ci.android.com/builds/submitted/16644040/aosp_cf_arm64_only_phone-userdebug/latest/raw/aosp_cf_arm64_only_phone-img-16644040.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bionic-android17-arm64
          path: built
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq erofs-utils e2fsprogs
      - name: Android 17 image
        run: curl -sSfL -o img.zip "$IMG_URL" && ls -la img.zip
      - name: Assemble
        run: |
          python3 native/tools/mini_root.py img.zip built a17-mini
          find a17-mini -maxdepth 4 | sort | head -80
          tar czf a17-mini.tar.gz a17-mini && ls -la a17-mini.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: a17-mini
          path: a17-mini.tar.gz
