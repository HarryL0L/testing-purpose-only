plugins { id 'com.android.application' }

android {
    namespace 'io.github.harryl0l.a17'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.harryl0l.a17'
        minSdk 29
        // 28: an app targeting 29+ may not run programs from its own files,
        // and Android 17's processes are exactly that (as in Termux).
        targetSdk 28
        versionCode 17
        versionName '0.17'
        ndk { abiFilters 'arm64-v8a' }
    }
    // One key for every build (here or in CI), so a new APK installs over the
    // old one. A debug key, in the repository on purpose: this is a test app.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
