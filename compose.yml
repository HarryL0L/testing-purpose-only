# Android 17 emulator for GitHub Codespaces. Started by ./start.sh.
services:
  android:
    # Built by start.sh with: docker build --network host -t android17-codespaces .
    # To use another Android 17 image, add --build-arg SYSTEM_IMAGE=... there:
    #   system-images;android-37.2;google_apis_ps16k;x86_64      (17.2 QPR)
    #   system-images;android-37.0;google_apis_playstore;x86_64  (Play Store)
    image: android17-codespaces
    container_name: android

    environment:
      AVD_NAME: "android17"
      DEVICE_PROFILE: "pixel_7"
      # Emulator window size (phone portrait) and the X screen that holds it.
      SKIN: "540x1200"
      SCREEN: "640x1280"
      NOVNC_PORT: "6080"
      # Size of Android's userdata partition. Larger values need more free
      # disk space on the Codespace; the emulator refuses to start otherwise.
      DATA_PARTITION: "2G"

    # Host networking for the same DNS reason: the emulator's user-mode
    # network resolves through the Codespace's resolver, so Android has
    # internet. noVNC listens on port 6080 of the Codespace.
    network_mode: "host"

    devices:
      - "/dev/kvm:/dev/kvm"

    volumes:
      # AVD (Android's disk, settings, installed apps). Kept under /tmp on
      # purpose: in Codespaces /tmp is a separate 44 GB disk with plenty of
      # room, while the 32 GB disk holding / and /workspaces is nearly full
      # once the SDK image is there, and the emulator refuses to start when
      # the disk holding the AVD is low on space.
      - /tmp/android-data:/data

    stop_grace_period: 1m
    restart: unless-stopped
