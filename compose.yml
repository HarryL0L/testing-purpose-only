# KDE Plasma 6.8 VM for GitHub Codespaces, using the qemus/qemu image.
# Started by ./start.sh, which first downloads the ISO into ./storage.
services:
  plasma:
    image: ghcr.io/qemus/qemu
    container_name: plasma

    environment:
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "20G"
      # User-mode networking: no bridge, no TUN device needed.
      NETWORK: "user"

    # Host networking: the Docker bridge in Codespaces has no working DNS
    # path, so the container shares the Codespace's network instead.
    # Port 8006 is then served directly on the Codespace.
    network_mode: "host"

    cap_add:
      - NET_ADMIN

    volumes:
      - ./storage:/storage
      # The ISO is downloaded by start.sh on the Codespace (where DNS works)
      # and mounted here; qemus boots /boot.iso and ignores BOOT.
      - ./storage/neon.iso:/boot.iso:ro

    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"

    stop_grace_period: 2m
    restart: always
