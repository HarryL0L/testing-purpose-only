# Android 17 emulator for GitHub Codespaces. Started by ./start.sh.
services:
  android:
    build:
      context: .
      # Docker's bridge network in Codespaces cannot resolve DNS names, so
      # build (apt + SDK downloads) on the host network.
      network: host
      args:
        # Android 17.0 (API 37) with Google APIs. Alternatives:
        #   system-images;android-37.2;google_apis_ps16k;x86_64      (17.2 QPR)
        #   system-images;android-37.0;google_apis_playstore;x86_64  (Play Store)
        SYSTEM_IMAGE: "system-images;android-37.0;google_apis;x86_64"
    image: android17-codespaces
    container_name: android

    environment:
      AVD_NAME: "android17"
      DEVICE_PROFILE: "pixel_7"
      # Emulator window size (phone portrait) and the X screen that holds it.
      SKIN: "540x1200"
      SCREEN: "640x1280"
      NOVNC_PORT: "6080"

    # Host networking for the same DNS reason: the emulator's user-mode
    # network resolves through the Codespace's resolver, so Android has
    # internet. noVNC listens on port 6080 of the Codespace.
    network_mode: "host"

    devices:
      - "/dev/kvm:/dev/kvm"

    volumes:
      # AVD (Android's disk, settings, installed apps) persists here.
      - ./data:/data

    stop_grace_period: 1m
    restart: unless-stopped
