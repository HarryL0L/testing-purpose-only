# KDE Plasma 6.8 VM for GitHub Codespaces, using the qemus/qemu image.
# Started by ./start.sh, which first downloads the ISO into ./storage.
services:
  plasma:
    image: ghcr.io/qemus/qemu
    container_name: plasma

    environment:
      # Standard 2-core Codespaces have 8 GB with about 5 GB free; 4G is
      # too tight for the host.
      RAM_SIZE: "3G"
      CPU_CORES: "2"
      # Keep well under the free space in ./storage (a standard Codespace
      # has about 15 GB left after the 3.4 GB ISO).
      DISK_SIZE: "12G"
      # User-mode networking: no bridge, no TUN device needed.
      NETWORK: "user"

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"

    volumes:
      - ./storage:/storage
      # The ISO is downloaded by start.sh on the Codespace (where DNS works)
      # and mounted here; qemus boots /boot.iso and ignores BOOT.
      - ./storage/neon.iso:/boot.iso

    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"

    stop_grace_period: 2m
    restart: always
