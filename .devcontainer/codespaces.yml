# QEMU virtual machine that boots the KDE neon User Edition ISO.
# KDE neon 20261025 ships Plasma 6.8.1.
services:
  plasma:
    container_name: plasma
    image: ghcr.io/qemus/qemu
    environment:
      # Pinned KDE neon User Edition ISO (Plasma 6.8.1).
      # Replace with https://files.kde.org/neon/images/desk/user/current/neon-user-desk-current.iso
      # to always boot the newest neon build instead.
      BOOT: "https://files.kde.org/neon/images/desk/user/20261025-1825/neon-user-desk-20261025-1825.iso"
      # Give the VM half the Codespace's RAM and all its cores.
      RAM_SIZE: "half"
      CPU_CORES: "max"
      # Virtual disk for the installed system (qcow2, grows on demand).
      # Standard Codespaces machines have 32 GB of storage, so keep this modest.
      DISK_SIZE: "24G"
      # Most Codespaces machines have no /dev/kvm. Without DEBUG the qemus
      # image exits when KVM is unavailable, which leaves Codespaces stuck on
      # "Building codespace". DEBUG=Y makes it fall back to software emulation
      # (TCG) instead. KVM is still used automatically when it exists.
      DEBUG: "Y"
    # privileged exposes /dev/kvm and /dev/net/tun when the host has them,
    # without failing container creation when it does not (a "devices:" entry
    # for a missing /dev/kvm aborts the build).
    privileged: true
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
    volumes:
      - ./storage:/storage
    restart: on-failure
    stop_grace_period: 2m
